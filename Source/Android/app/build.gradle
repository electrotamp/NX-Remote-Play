plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nxremoteplay.punchclient'
    compileSdk 34

    defaultConfig {
        applicationId (project.findProperty('appId') ?: "com.nxremoteplay.punchclient")
        minSdk 24
        targetSdk 34
        versionCode 48
        versionName "1.0.0-beta.1"

    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Enable the Compose UI and generated build configuration.
    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['DebugProbesKt.bin']
        }
    }

    composeOptions {
        // Matches Kotlin 1.9.24 per the official Compose-compiler/Kotlin compatibility map.
        kotlinCompilerExtensionVersion "1.5.14"
    }
}

dependencies {



    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
